name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for CI: it only ever reads the tree. The release
# workflows declare their own broader scopes at the job that needs them.
permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - run: uv python install ${{ matrix.python-version }}
      - name: Create venv + install
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[dev]"
      - name: Lint (ruff check)
        run: uv run ruff check .
      - name: Format (ruff format --check)
        run: uv run ruff format --check .
      - name: Build + validate the manifest
        run: uv run auspexai-tenant experiment build pkg/ --exact-label
      - name: Tests
        run: uv run pytest -q
