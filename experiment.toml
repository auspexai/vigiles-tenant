research_goal = "48-hour endurance drift monitoring of the calibrated gemma-3-1b-it-q4 configuration: the unchanged probe panel at temperature 0, half-hourly rounds, scored continuously against the C7 calibration baseline. Validates long-horizon stability of the model, fleet, and benchmark pipeline."
prompt_characteristics = "The unchanged fixed Vigiles probe panel at temperature 0 — identical inputs to the drift study, sustained for 48 hours."
[profiles.weekend_gemma.driver]
run_seconds = 172800
round_interval_seconds = 1800
max_rounds = 100000
stable_rounds = 100000
unit_prefix = "wg"

[profiles.weekend_qwen]
description = "48h qwen endurance: greedy, observe-only, half-hourly rounds."
[profiles.weekend_qwen.reducer]
kind = "builtin_process_only"
[profiles.weekend_qwen.experiment]
label = "vigiles-weekend-qwen"
model_id = "qwen2.5-0.5b-instruct-q4"
