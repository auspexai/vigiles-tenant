temperature = 0.8
top_p = 0.9
seed = 0
[profiles.capture_gptoss.capture]
raw = true                             # D20 raw-content capture (R3): executor emits raw_response → coordinator R3 transit buffer → SDK collector harvests live. Adds raw_content_capture to sensitive_flags → NOT auto-approved (review).
