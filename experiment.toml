# Vigiles experiment configuration (auspexai-tenant>=0.5.9).
#
# One checked-in file is the whole build. `experiment build` (SDK, generic)
# reads [experiment]/[executor]/[reducer]/[work_unit_source] and writes
# pkg/manifest.json — no per-tenant build.py. The drift driver reads [driver].
# Re-running the build stamps a fresh unique label suffix, so `experiment
# submit` never 409s on a label that is unique forever (incl. aborted runs).
#
#   auspexai-tenant experiment launch --key <vigiles_key>      # build + submit + await-approval + drive, ONE command
#   # or step-by-step:  experiment build pkg/  →  submit pkg/ --key …  →  run latest --key …

[experiment]
label = "vigiles-d6-drift"             # BASE label; the build stamps a unique suffix
tenant_id = "vigiles-lab"              # the onboarded tenancy — MUST match the signing key's bound tenant (coordinator rejects a mismatch with 403 manifest_tenant_mismatch)
contact = "vigiles@auspexai.network"   # → manifest tenant_maintainer_contact
# key_path = "~/.config/auspexai-tenant/vigiles.key"  # signing key; set once → `launch` signs with it, no --key. Omit to use the SDK default / --key.
model_id = "gemma-3-1b-it-q4"          # routing key; auto-acquired under this id from the coords below
model_version = "1.0"
# M3/#44 lazy auto-acquire: an auto_acquire worker that lacks the model pulls
# this exact GGUF in-line (ungated; anonymous HF download). Drop these only when
# the model is pre-staged on the worker by other means.
hf_repo = "unsloth/gemma-3-1b-it-GGUF"
hf_filename = "gemma-3-1b-it-Q4_K_M.gguf"
research_class = "behavioral_drift"    # §9 #48 — routine class → eligible for auto-approval at tier ≥ T2
local_weights_required = true
replication = 2                        # C7 (2026-06-29): within_cell_tolerance@2 — cross-worker corroboration restored. The C15 stopgap was repl-1/process_only because exact@2 byte-diverges on Ollama-version skew (0.17.7/0.18.2, same weights); tolerance (see [reducer]) treats a skewed worker as an OUTLIER, not a consensus-blocker, so ≥2 of the (up to 3) fleet workers corroborate WITHIN the declared envelope while drift still shows as the consensus signal across rounds.
duration_hours = 1                     # → manifest expected_duration_hours
sensitive_content_flags = []           # e.g. ["jailbreak"] → also needs an approver attestation
research_goal = "Vigiles D6 — the first real tenant: a deterministic behavioral-drift probe panel run against a worker-served local LLM through the AuspexAI inference broker. Each work unit re-runs a fixed probe at temperature 0 with a pinned seed; the executor reduces the response to a sha256 anchor plus light lexical features (no raw text — Research Ethics §7 containment) and the adaptive driver folds the per-probe consensus hashes into a Counter, converging once every probe's consensus response holds stable across consecutive rounds. Exercises the full local-LLM execution path (W-S model serving + sandbox inference broker) and the persisted, Rekor-anchored result-set attestation end-to-end."
prompt_characteristics = "A fixed 12-probe panel of neutral prompts spanning distinct behavior types (open-ended, arithmetic, reasoning, factual recall, list, enumeration, strict JSON format, classification, translation, constrained generation, code, and a benign safety-decline) carried in each unit's payload; re-run every round with a constant seed so a changed consensus hash is the drift signal. The wider panel gives breadth real resolution (~8%) instead of quartering on 3 probes."

[executor]
command = ["python", "executor.py"]    # run inside pkg/; package_sha256 is digested over pkg/

[reducer]
kind = "builtin_within_cell_tolerance"   # C7: replicas agree WITHIN each feature's `comparison` envelope (declared below), not byte-for-byte; the exact response_sha256 anchor strengthens but never blocks. Omit tolerance_features ⇒ every non-`exact` comparison feature is in the agreement predicate.

[work_unit_source]
kind = "static"                        # driver-fed; tarball coords optional

# ── Feature schema (D16.1 — the self-describing interpretability standard) ──
# Every feature the executor emits is declared HERE, in the SIGNED manifest,
# before any data exists: its meaning, §7-safe type + bounds, what a change
# implies, its role (feature authority), and how replicas are compared for
# consensus (the C7 tolerance envelope). The coordinator validates this at submit
# and ENFORCES it at result ingest — an undeclared / out-of-bounds field is
# rejected (§7), so under containment the declared set IS the entire
# interpretability surface (raw outputs are never retained). Declaring it bumps
# schema_version → "0.3" automatically ("0.4" when a profile also declares a
# [pre_registration] block — D16.2) and is REQUIRED for a certified/citable
# experiment. Keyed by the dotted result-payload path the executor emits
# (executor.py run_one); load_verified surfaces it as the column data dictionary.
# This block is the reference declaration a new tenant copies (design §8).

[feature_schema."schema"]
meaning = "result schema identifier"
kind = "categorical"
role = "provenance"
change_means = "the executor's result schema version changed"
categories = ["vigiles-drift-probe/v0"]

[feature_schema."probe_id"]
meaning = "which fixed probe produced this row"
kind = "categorical"
role = "key"                           # the primary drift/comparison join coordinate
change_means = "a different probe produced this row"
categories = ["p-greeting", "p-arithmetic", "p-reasoning", "p-fact", "p-list", "p-enumerate", "p-format-json", "p-classify", "p-translate", "p-constrained", "p-code", "p-refusal"]

[feature_schema."response_sha256"]
meaning = "SHA-256 of the raw model output — the authoritative byte-level drift anchor"
kind = "hash"
role = "anchor"
algorithm = "sha256"
change_means = "ANY change = output bytes differed, incl. reordering/whitespace the lexical features cannot see"
comparison = { rule = "exact" }

[feature_schema."response_chars"]
meaning = "length of the raw response in characters"
kind = "count"
role = "summary"
unit = "characters"
range = { min = 0 }
change_means = "the output got longer or shorter"

[feature_schema."eval_count"]
meaning = "backend-reported completion tokens generated"
kind = "count"
role = "summary"
unit = "tokens"
range = { min = 0 }
change_means = "the model emitted a different number of completion tokens"

[feature_schema."lexical.tokens"]
meaning = "whitespace-token count of the response"
kind = "count"
role = "summary"
unit = "whitespace_tokens"
range = { min = 0 }
change_means = "the response contains more or fewer whitespace tokens"

[feature_schema."lexical.unique_tokens"]
meaning = "distinct whitespace tokens in the response"
kind = "count"
role = "summary"
unit = "whitespace_tokens"
range = { min = 0 }
change_means = "the response's distinct-token count changed"

[feature_schema."lexical.type_token_ratio"]
meaning = "unique tokens / total tokens — lexical diversity"
kind = "numeric"
role = "summary"
unit = "ratio"
range = { min = 0.0, max = 1.0 }
valid_when = { field = "lexical.tokens", op = ">=", value = 5 }
invariant_to = ["token_order", "whitespace", "punctuation"]
change_means = "vocabulary richness shifted; does NOT capture reordering or formatting drift"
comparison = { rule = "numeric", rel = 0.02 }   # C7 calibrated 2026-07-02: within-band floor 0.000 → 0.02 safety factor; §5 different-model contrast confirms it still bites (c7_phase0_decision_memo.md §6). Tightened from 0.05.

[feature_schema."lexical.top_tokens"]
meaning = "the top-8 tokens by count"
kind = "set"
role = "summary"
element_kind = "categorical"
max_cardinality = 8
invariant_to = ["token_order"]
change_means = "the most-frequent vocabulary changed; §7 boundary — carries token fragments (certify-gate review)"
comparison = { rule = "set_jaccard", min = 0.9 }

[feature_schema."model.id"]
meaning = "the model id the worker served"
kind = "categorical"
role = "provenance"
categories = ["gemma-3-1b-it-q4"]
change_means = "a different model produced this row — stratify or exclude"

[feature_schema."model.gguf_sha256"]
meaning = "SHA-256 of the served GGUF weights"
kind = "hash"
role = "provenance"
algorithm = "sha256"
change_means = "the served weights differ — a provenance mismatch"

[driver]
entrypoint = "drift_driver:build"      # the DriverSpec factory (module:attr)
path = "driver"                        # dir holding drift_driver.py → on sys.path, so `run`/`launch` resolve it from the repo root (no cd)
journal = "auto"                       # auto → <label>.journal

# Adaptive-run knobs (opaque pass-through to drift_driver):
round_interval_seconds = 0             # 0 = no sleep (fast first keystone run); restore 300 for a temporally-spaced drift study
run_seconds = 0                        # 0 = converge-on-stability; >0 = duration mode (long-horizon)
max_rounds = 50                        # client-side round guard (raise for long-horizon: ~96 for 8h@300s)
stable_rounds = 3                      # consecutive no-new-bucket rounds → converged
baseline_rounds = 5                    # self-baseline (self_baseline_drift_design.md): first K rounds CALIBRATE this model's own reference set; drift is then measured FROM that baseline (not from Gemma). 0 = legacy D6. The run never converges before K elapses.
unit_prefix = "d6"                     # unit-id prefix (a run-distinct tag)

# ── Profiles (Phase-3 released-capability model — vigiles_onramp_phase3_design.md §3) ──
# Named override-sets over the shared capability above. A profile's sub-tables
# deep-merge onto the matching top-level table; select with `--profile <name>`
# (auspexai-tenant >= the increment-1 release). The BASE config (no --profile)
# stays = the keystone D6 config, so existing `build`/`launch` are byte-for-byte
# unchanged. The active profile rides the AUSPEXAI_PROFILE env var into the
# driver's own config re-load, so a profile's [driver] knobs reach drift_driver
# with no per-driver wiring. NOTE: the `certified` marker + tier-gated selection
# are Phase-3 increment 3 — these profiles carry ONLY real, enforced config today
# (no unenforced safety markers — declarative-enforcement hygiene).

# Run artifacts (journal, evidence bundle, benchmark reports) land in the
# STABLE per-user base — cwd-independent and the same path the dashboard reads,
# so a launch from any directory produces runs the dashboard sees. (2026-07-03:
# an unset [runs].dir wrote beside the launch cwd; the dashboard scanned its own
# base and showed "no benchmark" for a scored run.)
[runs]
dir = "~/.local/share/auspexai-tenant/runs"

# ── Drift Benchmark declaration ──────────────────────────────────────────────
# Every drift-study run scores against its OWN self-baseline: the first K rounds
# (K = [driver].baseline_rounds) establish this model's own normal, and the
# monitoring rounds (round >= K) are scored against them — drift from the model's
# OWN behavior over the run, NOT distance to a fixed anchor model
# (self_baseline_drift_design.md §3.1; the Gemma anchor exp-D2OGQK32 is retired).
# Declared HERE, at launch, before any data exists (the pre-registration posture);
# the dashboard materializes the self-drift score automatically. Profiles that
# produce no self-baseline (the calibration raw-spread run) switch this OFF with
# reference = "" — which, being a scalar, cleanly overrides the inherited "self".
[benchmark]
reference = "self"                     # self_baseline mode (alias); the reference is this run's own first-K baseline rounds
calibrate_envelope = false             # §3.2 (self-calibrated envelope, tenant-sdk >= 0.6.56): when true, 1 EU = THIS model's own baseline wobble (floored at the C7 envelope), the fuller Sentinel method. Default false → the fixed C7 envelope (§3.1); flip to true to compare once the first self-baseline runs validate the baseline dispersion.

[profiles.starter]
# The declawed on-ramp face: benign fixed probe panel, converge-on-stability,
# short, hash-only, repl-2. ≈ the base config today (Vigiles v0.1.0 already IS the
# starter), stated explicitly so the promotion gate (increment 2) has a named
# target to certify. Becomes the R1 no-code default.
description = "On-ramp starter: benign fixed probes, converge-on-stability, within_cell_tolerance@2 (C7 — version-skew-tolerant cross-worker corroboration; the reducer is inherited from the base)."

[profiles.starter.benchmark]
reference = ""  # starter runs live under OTHER tenancies — they cannot export our baseline

[profiles.starter.experiment]
sensitive_content_flags = []
replication = 2                        # C7: within_cell_tolerance@2 (was repl-1/process_only, the C15 stopgap). Reducer inherited from the base.
duration_hours = 1

# D16.2 §8: the certified starter ships a COMPLETE pre-registered design — the
# worked exemplar a new researcher copies. HONEST framing: a converge-on-stability
# run is DESCRIPTIVE (it establishes a stability baseline), and this block says
# so; only the research profile (long-horizon, observe-past-stability) below
# pre-registers a drift HYPOTHESIS. The comparison envelope is NOT re-declared:
# `features` names declared feature_schema paths and the pre-registered envelope
# IS each feature's `comparison` in this same signed manifest (nothing to drift).
# The coordinator COSE-signs + Rekor-anchors this at submit → `design ≺ data`.
[profiles.starter.pre_registration]
hypothesis = "gemma-3-1b-it-q4's response to each fixed probe is stable across rounds at temperature 0 with a pinned seed (no within-session drift)."
analysis_method = "per probe_id, compare the consensus feature vector round-over-round within the declared comparison envelope"
features = ["lexical.type_token_ratio", "lexical.top_tokens", "response_sha256"]
timescale = "intra_experiment_rounds"
decision_rule = "drift IFF a probe's consensus vector moves outside the declared comparison envelope after convergence"
expected_result = "descriptive stability baseline: no probe drifts; null = at least one probe drifts"
stopping_rule = "converge-on-stability (stable_rounds=3), declared up front - not data-peeking-dependent"
comparison_keys = ["probe_id"]
min_replication = 2

[profiles.starter.driver]
run_seconds = 0                        # converge-on-stability (NOT long-horizon)
round_interval_seconds = 0
max_rounds = 50
stable_rounds = 3

[profiles.calibration]
# C7 envelope calibration (c7_calibration_campaign.md §3, Phase 0 launched 2026-07):
# a fixed-VOLUME raw-spread measurement, not a drift study. Every unit executes on
# EVERY fleet config (repl = N_configs = 3) so each unit yields direct same-cell
# cross-config comparisons; the analysis reads the RAW per-replica feature payloads
# offline (pairwise per-feature deltas) — the in-manifest comparison envelope stays
# the uncalibrated placeholder and is deliberately NOT an analysis input. Phase-0
# deliverable = the within-band (0.17.7↔0.18.2 mayhem-pair) noise floor; cross-band
# (↔0.30.11) deltas feed ONLY the §7 decision-gate memo — never the envelope,
# pre-ratification. Probe panel / seed / num_predict inherited UNCHANGED: calibration
# must measure the same panel the drift study runs, so the noise floor transfers.
description = "C7 tolerance-envelope calibration: fixed-volume (25 rounds × 12 probes = 300 units), repl-3 all-config raw-spread collection; offline pairwise delta analysis per c7_calibration_campaign.md; placeholder envelope not consulted."

[profiles.calibration.benchmark]
reference = ""  # this run IS the baseline — it scores against nothing

[profiles.calibration.experiment]
label = "vigiles-c7-calibration"
replication = 3                        # target = N_configs (campaign §3): the same unit executes on every config. C14 default floor (2) lets a unit settle if one config is briefly unavailable — that unit just contributes fewer cross-pairs.
duration_hours = 1
research_goal = "C7 tolerance-envelope calibration (spec: c7_calibration_campaign.md). Characterize the per-feature legitimate cross-worker noise floor by re-running the fixed Vigiles probe panel at replication = N_configs, so every work unit executes on every fleet config (linux/aarch64 Ollama 0.17.7, linux/aarch64 Ollama 0.18.2, darwin/arm64 Ollama 0.30.11). Analysis consumes the raw per-replica feature payloads offline: pairwise per-feature deltas, stratified within-band vs cross-band, per probe (§8 noise-vs-signal criterion applied per delta). Fixed volume — 25 rounds x 12 probes = 300 units (~900 executions); no early convergence (stable_rounds unreachable); stops at max_rounds. Output feeds the calibrated envelope + the Phase-0->Phase-1 decision-gate memo (0.30.11 cell-vs-drift)."
prompt_characteristics = "The unchanged fixed 12-probe Vigiles panel at temperature 0 with the pinned seed — identical inputs to the drift study; only the replication, volume, and analysis intent differ."

[profiles.calibration.driver]
run_seconds = 0                        # NOT duration mode — fixed round count below
round_interval_seconds = 0             # back-to-back; calibration measures cross-worker spread, not temporal drift
max_rounds = 25                        # THE volume knob: 25 rounds × 12 probes = 300 units × 3 replicas ≈ 900 executions (campaign §3)
stable_rounds = 1000                   # deliberately unreachable — a fixed-volume run must not converge-on-stability early; it stops at max_rounds
baseline_rounds = 0                    # NOT a self-baseline drift study: fixed-volume raw-spread collection, analyzed offline — the driver's baseline phase is irrelevant here (avoids spurious drift-event log noise)
unit_prefix = "cal"

[profiles.research]
# The research-frontier face: long-horizon duration mode, temporally-spaced rounds,
# observation PAST stability (a changed consensus hash after stability = a drift
# event). UNCERTIFIED — HEAD / R2+ only, runs under per-experiment ethics review;
# NOT a no-code default (§3.2).
description = "Research frontier: long-horizon duration mode, temporally-spaced rounds, observe past stability."

[profiles.research.experiment]
duration_hours = 8
sensitive_content_flags = []           # bump to e.g. ["jailbreak"] for an adversarial drift panel (then needs an approver attestation)

# D16.2 §8: the research profile pre-registers the DRIFT hypothesis (the
# confirmatory long-horizon study), in contrast to the starter's descriptive
# baseline. Same referenced envelope; a changed analysis post-data is a signed
# deviation record, never an edit.
[profiles.research.pre_registration]
hypothesis = "over a multi-hour horizon, at least one fixed probe's consensus response drifts (the serving stack, not the pinned weights, moves under the panel)."
analysis_method = "per probe_id, track the consensus feature vector across temporally-spaced rounds; a post-stability change in the consensus hash or an envelope exit is a drift event"
features = ["lexical.type_token_ratio", "lexical.top_tokens", "response_sha256"]
timescale = "long_horizon"
decision_rule = "drift IFF a probe's consensus vector exits the declared comparison envelope, or its consensus hash changes, after initial stability"
expected_result = "at least one drift event over the 8h horizon; null = the panel stays stable throughout"
stopping_rule = "fixed 8h duration (run_seconds=28800), declared up front - not data-peeking-dependent"
comparison_keys = ["probe_id"]
min_replication = 2

[profiles.research.driver]
run_seconds = 28800                    # 8h duration mode (keep issuing rounds; observe drift past stability)
round_interval_seconds = 300           # temporally-spaced (5-min cadence)
max_rounds = 120                       # ~96 rounds for 8h@300s, with headroom
stable_rounds = 3

# ── Weekend endurance campaign (2026-07-04/06): 2 models × 48h, self-baseline ──
# Two CONCURRENT experiments (one per model — model identity is schema-enforced
# per manifest; generation policy is per-EXPERIMENT, broker-enforced on every
# worker). Both self-baseline (inherit [benchmark] reference = "self") → each
# auto-scores against its OWN first-K rounds at completion. Greedy gemma keeps
# tolerance consensus (proven in-envelope); smollm2 runs observe-only (unproven
# cross-version byte-agreement) — every replica receipted + exportable.
# (The qwen cross-model rung was retired with the Gemma anchor, 2026-07-14.)

[profiles.weekend_gemma]
