# ── CONTENT-CAPTURE batch (2026-07-15): gpt-oss-20b / Gemma-3-1B / Qwen3-1.7B, 10h, det + sampling ──
# Six single-model experiments (3 models × {seeded-sampling temp 0.8, greedy temp 0}), each a 10h
# duration run, process_only, back-to-back rounds, self-baselined (inherited [benchmark] reference =
# "self", K=5). NEW here: [capture] raw = true (D20) — the executor emits raw_response, the coordinator
# parks it in the ephemeral R3 transit buffer (1h TTL, never persisted), and the SDK's raw-content
# collector harvests it live during the run. ⚠ CONSEQUENCES: (1) capture adds `raw_content_capture` to
# sensitive_content_flags → the run does NOT auto-approve (routine_no_sensitive_flags fails) → per-
# experiment REVIEW; permitted at R3. (2) collection is R3-gated + audited + one-time-read + evicts.
# Fleet-fit: gpt-oss is Mac-only (repl-1); Gemma-3-1B (~2.42 GB serve) + Qwen3-1.7B (~3.25 GB serve) fit the Jetsons
# (repl-2 mayhem pair). Fresh prefixes (cap{g,p,q}{s,d}). Requires tenant-sdk >= 0.6.60 — the release
# that lets a `[capture] raw` manifest BUILD at all (0.6.58/0.6.59's Manifest validator rejected the
# capture member + raw_content_capture flag → every capture build failed). 0.6.60 also carries the live
# HARVEST (RawContentCollector polls GET /raw-content every 180s into runs/<label>/raw_content.jsonl,
# 0.6.58) and makes `experiment export` co-locate bundle.json there via [runs].dir (0.6.59). On an older
# SDK these profiles won't build. vigiles-lab is R3 → collection is authorized. raw_content_capture is a
# review-routing flag (NOT an approver/ethics gate), so each of the six needs a per-experiment REVIEW
# (does NOT auto-approve) but requires no approver_attestations.

[profiles.capture_gptoss]
description = "10h OpenAI gpt-oss-20b (native MXFP4, single-file GGUF) seeded-sampling drift WITH raw-content capture (D20): process_only, back-to-back, repl-1 (Mac-only); self-baselined; forces per-experiment review (R3)."
